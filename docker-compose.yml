services:
  db:
    image: postgres:16
    container_name: bakery-db
    environment:
      POSTGRES_DB: bakery
      POSTGRES_USER: bakery_user
      POSTGRES_PASSWORD: bakery_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bakery-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bakery_user -d bakery"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: bakery-backend
    environment:
      DATABASE_URL: postgresql://bakery_user:bakery_password@db:5432/bakery
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bakery-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: bakery-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - bakery-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: ./backend
    container_name: bakery-worker
    command: python -u worker.py
    healthcheck:
      test: ["CMD", "python", "-c", "import pika; c=pika.BlockingConnection(pika.ConnectionParameters(host='rabbitmq')); c.close()"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - bakery-network

  frontend:
    build: ./frontend
    container_name: bakery-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - bakery-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  bakery-network:
    driver: bridge